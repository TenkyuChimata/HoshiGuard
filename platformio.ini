[platformio]
default_envs = genericSTM32F103C8-bridge-binary

[stm32_common]
platform = ststm32
board = genericSTM32F103C8
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
build_flags =
  -Os
  -flto
  -ffunction-sections
  -fdata-sections
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC=0
build_unflags = -O0 -O1 -O2 -O3 -Og
upload_flags = -c set CPUTAPID 0

[env:genericSTM32F103C8]
platform = ${stm32_common.platform}
board = ${stm32_common.board}
framework = ${stm32_common.framework}
upload_protocol = ${stm32_common.upload_protocol}
monitor_speed = ${stm32_common.monitor_speed}
build_flags = ${stm32_common.build_flags}
build_unflags = ${stm32_common.build_unflags}
upload_flags = ${stm32_common.upload_flags}

[env:genericSTM32F103C8-capture]
platform = ${stm32_common.platform}
board = ${stm32_common.board}
framework = ${stm32_common.framework}
upload_protocol = ${stm32_common.upload_protocol}
monitor_speed = ${stm32_common.monitor_speed}
build_flags =
  ${stm32_common.build_flags}
  -D RAW_CAPTURE_MODE=1
  -D RAW_CAPTURE_INCLUDE_PRIORITY_UBX=1
  -D RAW_CAPTURE_INCLUDE_SFRBX=1
  -D RAW_CAPTURE_QZSS_ONLY=1
  -D RAW_CAPTURE_INCLUDE_SFRBX_HEADERS=1
  -D RAW_CAPTURE_INCLUDE_L1S=1
  -D RAW_CAPTURE_INCLUDE_PPS=1
  -D RAW_CAPTURE_INCLUDE_TIMTP=1
  -D RAW_CAPTURE_QUEUE_DEPTH=4
  -D LOG_QUEUE_DEPTH=5
  -D DEBUG_LEVEL=0
  -D RAW_HEX_OUTPUT=0
  -D CAPTURE_PRIVACY_MODE=1
  -D CAPTURE_INCLUDE_NAV_PVT_RAW=0
build_unflags = ${stm32_common.build_unflags}
upload_flags = ${stm32_common.upload_flags}

[env:genericSTM32F103C8-debug]
platform = ${stm32_common.platform}
board = ${stm32_common.board}
framework = ${stm32_common.framework}
upload_protocol = ${stm32_common.upload_protocol}
monitor_speed = ${stm32_common.monitor_speed}
build_flags =
  ${stm32_common.build_flags}
  -D RAW_CAPTURE_MODE=1
  -D RAW_CAPTURE_INCLUDE_PRIORITY_UBX=1
  -D RAW_CAPTURE_INCLUDE_SFRBX=1
  -D RAW_CAPTURE_QZSS_ONLY=1
  -D RAW_CAPTURE_INCLUDE_SFRBX_HEADERS=1
  -D RAW_CAPTURE_INCLUDE_L1S=1
  -D RAW_CAPTURE_INCLUDE_PPS=1
  -D RAW_CAPTURE_INCLUDE_TIMTP=1
  -D RAW_CAPTURE_QUEUE_DEPTH=4
  -D LOG_QUEUE_DEPTH=5
  -D DEBUG_LEVEL=3
  -D RAW_HEX_OUTPUT=1
  -D GNSS_RX_PROBE=1
  -D GNSS_TX_ECHO_HEX=1
  -D CAPTURE_PRIVACY_MODE=0
  -D CAPTURE_INCLUDE_NAV_PVT_RAW=1
build_unflags = ${stm32_common.build_unflags}
upload_flags = ${stm32_common.upload_flags}

[env:genericSTM32F103C8-json]
platform = ${stm32_common.platform}
board = ${stm32_common.board}
framework = ${stm32_common.framework}
upload_protocol = ${stm32_common.upload_protocol}
monitor_speed = ${stm32_common.monitor_speed}
build_flags =
  ${stm32_common.build_flags}
  -D JSON_OUTPUT=1
build_unflags = ${stm32_common.build_unflags}
upload_flags = ${stm32_common.upload_flags}

[env:genericSTM32F103C8-loopback]
platform = ${stm32_common.platform}
board = ${stm32_common.board}
framework = ${stm32_common.framework}
upload_protocol = ${stm32_common.upload_protocol}
monitor_speed = ${stm32_common.monitor_speed}
build_flags =
  ${stm32_common.build_flags}
  -D GNSS_UART_LOOPBACK_TEST=1
  -D DEBUG_LEVEL=3
build_unflags = ${stm32_common.build_unflags}
upload_flags = ${stm32_common.upload_flags}

[env:genericSTM32F103C8-debug-38400]
platform = ${stm32_common.platform}
board = ${stm32_common.board}
framework = ${stm32_common.framework}
upload_protocol = ${stm32_common.upload_protocol}
monitor_speed = ${stm32_common.monitor_speed}
build_flags =
  ${stm32_common.build_flags}
  -D RAW_CAPTURE_MODE=1
  -D RAW_CAPTURE_INCLUDE_PRIORITY_UBX=1
  -D RAW_CAPTURE_INCLUDE_SFRBX=1
  -D RAW_CAPTURE_QZSS_ONLY=1
  -D RAW_CAPTURE_INCLUDE_SFRBX_HEADERS=1
  -D RAW_CAPTURE_INCLUDE_L1S=1
  -D RAW_CAPTURE_INCLUDE_PPS=1
  -D RAW_CAPTURE_INCLUDE_TIMTP=1
  -D LOG_QUEUE_DEPTH=5
  -D DEBUG_LEVEL=3
  -D RAW_HEX_OUTPUT=1
  -D GNSS_RX_PROBE=1
  -D GNSS_TX_ECHO_HEX=1
  -D GNSS_CHANGE_BAUD=0
  -D GNSS_TARGET_BAUD=38400UL
  -D CAPTURE_PRIVACY_MODE=0
  -D CAPTURE_INCLUDE_NAV_PVT_RAW=1
build_unflags = ${stm32_common.build_unflags}
upload_flags = ${stm32_common.upload_flags}

[env:genericSTM32F103C8-capture-l1s]
platform = ${stm32_common.platform}
board = ${stm32_common.board}
framework = ${stm32_common.framework}
upload_protocol = ${stm32_common.upload_protocol}
monitor_speed = ${stm32_common.monitor_speed}
build_flags =
  ${stm32_common.build_flags}
  -D RAW_CAPTURE_MODE=1
  -D L1S_COMPACT_CAPTURE=1
  -D RAW_CAPTURE_INCLUDE_PRIORITY_UBX=0
  -D RAW_CAPTURE_INCLUDE_SFRBX=0
  -D RAW_CAPTURE_INCLUDE_SFRBX_HEADERS=0
  -D RAW_CAPTURE_INCLUDE_L1S=0
  -D RAW_CAPTURE_INCLUDE_PPS=0
  -D RAW_CAPTURE_INCLUDE_TIMTP=0
  -D RAW_CAPTURE_INCLUDE_TIMTP_MATCH=1
  -D CAPTURE_PRIVACY_MODE=1
  -D CAPTURE_INCLUDE_NAV_PVT_RAW=0
  -D LOG_QUEUE_DEPTH=6
  -D LOG_L1S_RESERVED_SLOTS=3
  -D DIAGNOSTIC_INTERVAL_MS=30000UL
  -D DEBUG_LEVEL=0
  -D RAW_HEX_OUTPUT=0
build_unflags = ${stm32_common.build_unflags}
upload_flags = ${stm32_common.upload_flags}

[env:genericSTM32F103C8-bridge-binary]
platform = ${stm32_common.platform}
board = ${stm32_common.board}
framework = ${stm32_common.framework}
upload_protocol = ${stm32_common.upload_protocol}
monitor_speed = ${stm32_common.monitor_speed}
build_flags =
  ${stm32_common.build_flags}
  -D BRIDGE_BINARY_MODE=1
  -D CAPTURE_PRIVACY_MODE=1
  -D CAPTURE_INCLUDE_NAV_PVT_RAW=0
  -D OUTPUT_NAV_PVT_COORDINATES=0
  -D RAW_CAPTURE_MODE=0
  -D LOG_QUEUE_DEPTH=1
  -D LOG_RECORD_MAX=128
  -D DEBUG_LEVEL=0
build_unflags = ${stm32_common.build_unflags}
upload_flags = ${stm32_common.upload_flags}

[env:genericSTM32F103C8-bridge-text]
platform = ${stm32_common.platform}
board = ${stm32_common.board}
framework = ${stm32_common.framework}
upload_protocol = ${stm32_common.upload_protocol}
monitor_speed = ${stm32_common.monitor_speed}
build_flags =
  ${stm32_common.build_flags}
  -D BRIDGE_TEXT_MODE=1
  -D CAPTURE_PRIVACY_MODE=1
  -D CAPTURE_INCLUDE_NAV_PVT_RAW=0
  -D OUTPUT_NAV_PVT_COORDINATES=0
  -D RAW_CAPTURE_MODE=0
  -D LOG_QUEUE_DEPTH=6
  -D LOG_L1S_RESERVED_SLOTS=4
  -D LOG_RECORD_MAX=700
  -D DEBUG_LEVEL=1
build_unflags = ${stm32_common.build_unflags}
upload_flags = ${stm32_common.upload_flags}

[env:genericSTM32F103C8-bridge-binary-no-oled]
extends = env:genericSTM32F103C8-bridge-binary
build_flags =
  ${env:genericSTM32F103C8-bridge-binary.build_flags}
  -D HOSHIGUARD_OLED=0

; 最小配線用。既存の既定環境は OLED 有効のまま維持する。
[env:generic-minimal]
extends = env:genericSTM32F103C8-bridge-binary-no-oled
build_flags =
  ${env:genericSTM32F103C8-bridge-binary-no-oled.build_flags}
  -D HOSHIGUARD_STATUS_LED=0
  -D HOSHIGUARD_OLED_SWITCH=0
  -D HOSHIGUARD_GNSS_RESET=0

; PC13 の吸電流接続 LED がある汎用基板専用。Explorer 原版の LED には使用しない。
[env:generic-status-led]
extends = env:genericSTM32F103C8-bridge-binary-no-oled
build_flags =
  ${env:genericSTM32F103C8-bridge-binary-no-oled.build_flags}
  -D HOSHIGUARD_STATUS_LED=1

[env:explorer-e-c111g]
extends = env:genericSTM32F103C8-bridge-binary
build_flags =
  ${env:genericSTM32F103C8-bridge-binary.build_flags}
  -D HOSHIGUARD_OLED_SWITCH=1

; PA15 の実配線・V_IO・SWD を確認した場合だけ選択する。
[env:explorer-e-c111g-recovery]
extends = env:explorer-e-c111g
build_flags =
  ${env:explorer-e-c111g.build_flags}
  -D HOSHIGUARD_GNSS_RESET=1

[env:explorer-e-c111g-no-oled]
extends = env:explorer-e-c111g
build_flags =
  ${env:explorer-e-c111g.build_flags}
  -D HOSHIGUARD_OLED=0

; Explorer 上でも追加回路なしで動作する比較用環境。
[env:explorer-e-c111g-minimal]
extends = env:generic-minimal

; 実機検証用。既定環境の TIM1/IWDG は引き続き無効。
[env:generic-tim1-validation]
extends = env:genericSTM32F103C8-bridge-binary
build_flags =
  ${env:genericSTM32F103C8-bridge-binary.build_flags}
  -D USE_TIM1_INPUT_CAPTURE=1

; 外付け 8 MHz 水晶を実装した Blue Pill 専用。HSE ON の HAL profile で 72 MHz を設定する。
[env:bluepill-tim1-validation]
extends = env:generic-tim1-validation
board = bluepill_f103c8
build_flags =
  ${env:generic-tim1-validation.build_flags}
  -D ENABLE_HWSERIAL2
  -D HOSHIGUARD_CLOCK_PROFILE=1
  -D HSE_VALUE=8000000U

; Y1 の 8 MHz CMOS 出力を OSC_IN へ接続した基板専用。TIM1/IWDG は独立して選択する。
[env:explorer-e-c111g-72mhz]
extends = env:explorer-e-c111g
build_flags =
  ${env:explorer-e-c111g.build_flags}
  -D HOSHIGUARD_CLOCK_PROFILE=2
  -D HSE_VALUE=8000000U

[env:explorer-e-c111g-72mhz-tim1]
extends = env:explorer-e-c111g-72mhz
build_flags =
  ${env:explorer-e-c111g-72mhz.build_flags}
  -D USE_TIM1_INPUT_CAPTURE=1

[env:explorer-e-c111g-72mhz-iwdg]
extends = env:explorer-e-c111g-72mhz
build_flags =
  ${env:explorer-e-c111g-72mhz.build_flags}
  -D HOSHIGUARD_IWDG=1

[env:explorer-e-c111g-72mhz-tim1-iwdg]
extends = env:explorer-e-c111g-72mhz-tim1
build_flags =
  ${env:explorer-e-c111g-72mhz-tim1.build_flags}
  -D HOSHIGUARD_IWDG=1

[env:generic-iwdg-validation]
extends = env:genericSTM32F103C8-bridge-binary
build_flags =
  ${env:genericSTM32F103C8-bridge-binary.build_flags}
  -D HOSHIGUARD_IWDG=1

[env:generic-tim1-iwdg-validation]
extends = env:generic-tim1-validation
build_flags =
  ${env:generic-tim1-validation.build_flags}
  -D HOSHIGUARD_IWDG=1

[env:explorer-e-c111g-full]
extends = env:explorer-e-c111g-recovery
build_flags =
  ${env:explorer-e-c111g-recovery.build_flags}
  -D USE_TIM1_INPUT_CAPTURE=1
  -D HOSHIGUARD_IWDG=1
  -D HOSHIGUARD_CLOCK_PROFILE=2
  -D HSE_VALUE=8000000U

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
  +<ubx_parser.cpp>
  +<qzss_l1s.cpp>
  +<dcr_dcx_decoder.cpp>
  +<gnss_config.cpp>
  +<baud_switch.cpp>
  +<gnss_self_test.cpp>
  +<gnss_rx_probe.cpp>
  +<gnss_uart_diag.cpp>
  +<raw_capture.cpp>
  +<log_arbiter.cpp>
  +<safe_format.cpp>
  +<startup_metadata.cpp>
  +<startup_sequence.cpp>
  +<tim_tp.cpp>
  +<time_sync.cpp>
  +<ubx_dispatcher.cpp>
  +<bridge_protocol.cpp>
  +<oled_i2c.cpp>
  +<ssd1306.cpp>
  +<status_display.cpp>
  +<receiver_aux.cpp>
build_flags =
  -D HOSHIGUARD_STATUS_LED=1
  -D HOSHIGUARD_OLED_SWITCH=1
  -D HOSHIGUARD_GNSS_RESET=1
  -std=gnu++11
  -Wall
  -Wextra
  -Wpedantic
  -Wformat=2
  -Wformat-truncation=2
  -Wformat-overflow=2
  -Wconversion
  -Wsign-conversion
