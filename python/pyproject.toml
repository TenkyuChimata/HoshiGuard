[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hoshiguard"
version = "0.3.0"
description = "QZSS L1S の Bridge 受信・DCR/DCX デコード"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
api = ["aiohttp>=3.14.3,<4"]
test = ["aiohttp>=3.14.3,<4", "jsonschema>=4.18"]

[project.scripts]
hoshiguard = "hoshiguard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hoshiguard*"]

[tool.setuptools.package-data]
hoshiguard = ["data/**/*.json", "_vendor/azarashi/LICENSE"]
